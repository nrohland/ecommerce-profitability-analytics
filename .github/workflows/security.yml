name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '20 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 0 --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan fetched history with fully redacted findings
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts='--all --full-history' --ignore-gitleaks-allow --max-decode-depth=2 --redact=100 --no-banner --report-format=json --report-path="$RUNNER_TEMP/gitleaks-redacted.json"
      # Potential-secret reports are not uploaded as public artifacts.

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify fail-closed audit policy
        run: python scripts/test_security_audit.py
      - name: Audit locked JavaScript and reviewed framework minimums
        run: python scripts/security_audit.py --directory .
      - name: Audit Python requirements and resolved dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off


  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: '/language:${{ matrix.language }}'

  browser:
    if: github.event_name != 'schedule'
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install and build reviewed application
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npm run build
          google-chrome --version
      - name: Verify routes and hydration at desktop and mobile widths
        env:
          SECURITY_BROWSER_CHANNEL: chrome
          EVIDENCE_DIR: ${{ runner.temp }}/security-ui-evidence
        run: node scripts/security_smoke.mjs '{"directory":".","static":true,"routes":["/"],"kind":"ecommerce"}'
      - name: Diagnose hydration with readable development errors
        if: failure()
        continue-on-error: true
        env:
          SECURITY_BROWSER_CHANNEL: chrome
          SECURITY_SMOKE_DEV: '1'
          EVIDENCE_DIR: ${{ runner.temp }}/security-ui-diagnostic
        run: node scripts/security_smoke.mjs '{"directory":".","static":true,"routes":["/"],"kind":"ecommerce"}'
      - name: Retain public demo captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-ui-evidence
          path: |
            ${{ runner.temp }}/security-ui-evidence
            ${{ runner.temp }}/security-ui-diagnostic
          retention-days: 7
          if-no-files-found: ignore
